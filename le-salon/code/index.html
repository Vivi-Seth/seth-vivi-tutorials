<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0C1117">
<title>Le Salon</title>
<style>
  :root {
    --bg-deep: #0C1117;
    --gold: #d4a857; --gold-light: #e8c987; --rose: #e8b4c8;
    --text: #e9e4da; --dim: #9a93a5; --border: rgba(255,255,255,0.09);
    --bg-opacity: 1; --glass-blur: 16px; --bubble-opacity: 0.6; --overlay: 0; --font-scale: 1;
    --owner-tint: rgba(90,42,64,var(--bubble-opacity));
    --seth-tint: rgba(28,34,52,var(--bubble-opacity));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg-deep); color: var(--text);
    font-family: -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 300; display: flex; flex-direction: column; overflow: hidden;
    font-size: calc(15px * var(--font-scale));
  }
  /* 壁纸层 */
  #wallpaper {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: none; /* 换成你自己的壁纸: url('/assets/bg.png') */
    background-size: cover; background-position: center top;
    opacity: var(--bg-opacity); transition: opacity .3s;
  }
  #darkOverlayEl { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: #05080c; opacity: var(--overlay); }
  /* 顶栏 */
  header {
    position: relative; z-index: 10; flex-shrink: 0;
    padding: calc(env(safe-area-inset-top) + 11px) 14px 9px;
    background: rgba(11,16,23,0.42);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2); backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .title {
    font-size: 20px; letter-spacing: 1.5px; font-family: Georgia, serif;
    background: linear-gradient(100deg, var(--gold-light), var(--gold) 55%, #b8924a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hright { display: flex; align-items: center; gap: 10px; }
  .roster { display: flex; gap: 5px; }
  .dot {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #10131a; font-weight: 600;
    opacity: .22; transition: opacity .3s;
  }
  .dot.on { opacity: 1; box-shadow: 0 0 7px rgba(212,168,87,.3); }
  .gear { background: none; border: none; color: var(--dim); font-size: 19px; padding: 2px 4px; }
  /* 置顶横幅 */
  #pinBar {
    position: relative; z-index: 9; flex-shrink: 0; display: none;
    padding: 8px 12px; gap: 8px; align-items: center;
    background: rgba(212,168,87,0.12);
    -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur));
    border-bottom: 1px solid rgba(212,168,87,0.25);
    font-size: calc(13px * var(--font-scale));
  }
  #pinBar.show { display: flex; }
  #pinBar .pin-ico { flex-shrink: 0; }
  #pinBar .pin-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gold-light); }
  #pinBar .pin-x { flex-shrink: 0; color: var(--dim); padding: 2px 6px; font-size: 15px; }
  /* 消息区 */
  #flow {
    position: relative; z-index: 5; flex: 1; overflow-y: auto;
    padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain;
  }
  .msg { display: flex; flex-direction: column; max-width: 84%; animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .meta { font-size: calc(11px * var(--font-scale)); color: var(--dim); margin-bottom: 3px; padding: 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .msg .meta .name { font-weight: 500; }
  .msg .bubble {
    padding: 9px 13px; border-radius: 15px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
    background: var(--seth-tint);
    -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--border);
  }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.me .bubble { background: var(--owner-tint); border-color: rgba(232,180,200,0.18); border-bottom-right-radius: 4px; }
  .msg:not(.me) .bubble { border-bottom-left-radius: 4px; }
  .msg.note .bubble { background: rgba(20,26,38,0.3); border: 1px dashed rgba(255,255,255,0.18); color: var(--dim); font-size: calc(13px * var(--font-scale)); }
  .msg.announce { align-self: center; max-width: 94%; align-items: center; }
  .msg.announce .meta { justify-content: center; color: var(--gold); }
  .msg.announce .bubble { background: rgba(212,168,87,.13); border: 1px solid rgba(212,168,87,.4); color: var(--gold-light); text-align: center; }
  .msg.pinned-flash .bubble { box-shadow: 0 0 0 2px var(--gold); }
  .msg .mention { color: var(--gold-light); }
  .msg .bubble strong { color: var(--gold-light); font-weight: 600; }
  .msg .bubble em { font-style: italic; opacity: .92; }
  .msg .bubble del { opacity: .5; }
  .msg .bubble code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; font-size: .88em; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .msg .think { margin: 1px 0 5px; }
  .msg .think-label { font-size: 11px; color: var(--dim); cursor: pointer; user-select: none; }
  .msg .think-label::before { content: '▸ '; }
  .msg .think.open .think-label::before { content: '▾ '; }
  .msg .think-body { display: none; margin-top: 4px; padding: 8px 11px; border-left: 2px solid rgba(212,168,87,.4); background: rgba(212,168,87,.05); border-radius: 0 8px 8px 0; color: var(--dim); white-space: pre-wrap; line-height: 1.55; font-size: calc(12.5px * var(--font-scale)); }
  .msg .think.open .think-body { display: block; }
  /* 输入区 */
  footer {
    position: relative; z-index: 10; flex-shrink: 0;
    padding: 8px 10px calc(env(safe-area-inset-bottom) + 10px);
    background: rgba(11,16,23,0.45);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2); backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: flex-end;
  }
  .fbtn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(20,30,42,0.45); color: var(--gold); font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #noteBtn { color: var(--dim); font-size: 13px; }
  #noteBtn.on { color: var(--rose); border-color: var(--rose); }
  #input {
    flex: 1; min-height: 38px; max-height: 110px; padding: 9px 13px;
    border-radius: 12px; border: 1px solid var(--border); background: rgba(20,30,42,0.45);
    color: var(--text); font-size: calc(15px * var(--font-scale)); line-height: 1.4; resize: none;
    font-family: inherit; outline: none;
    -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur));
  }
  #sendBtn {
    width: 62px; height: 38px; border-radius: 12px; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, #b8924a, var(--gold)); color: #15101c;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
  }
  #sendBtn:active { transform: scale(.96); }
  /* 底部弹层通用 */
  .sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(18,23,33,0.92);
    -webkit-backdrop-filter: blur(24px) saturate(1.3); backdrop-filter: blur(24px) saturate(1.3);
    border-radius: 18px 18px 0 0; border-top: 1px solid var(--border);
    padding: 14px 14px calc(env(safe-area-inset-bottom) + 16px);
    transform: translateY(110%); transition: transform .22s ease;
    box-shadow: 0 -10px 40px rgba(0,0,0,.5); max-height: 75vh; overflow-y: auto;
  }
  .sheet.open { transform: none; }
  .sheet h3 { font-size: 13px; color: var(--dim); font-weight: 500; margin-bottom: 10px; }
  .atItem { display: flex; align-items: center; gap: 10px; padding: 11px 8px; border-radius: 10px; }
  .atItem:active { background: rgba(255,255,255,0.06); }
  .atItem .d { width: 12px; height: 12px; border-radius: 50%; }
  .atItem .off { color: var(--dim); font-size: 12px; margin-left: auto; }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: none; }
  #mask.show { display: block; }
  /* 设置面板 */
  .sec { margin-bottom: 16px; }
  .sec-label { font-size: 12px; color: var(--gold); letter-spacing: 1px; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .slider-row .sl { width: 60px; color: var(--dim); flex-shrink: 0; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--gold); }
  .slider-row .sv { width: 42px; text-align: right; color: var(--dim); font-size: 12px; flex-shrink: 0; }
  .bg-option { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 14px; }
  .bg-option input { accent-color: var(--gold); }
  .upload-area {
    margin-top: 8px; padding: 16px; border: 1px dashed var(--border); border-radius: 10px;
    text-align: center; color: var(--dim); font-size: 13px;
  }
  .reset-btn { width: 100%; margin-top: 4px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--dim); font-size: 13px; }
  /* 消息操作菜单 */
  #msgMenu .atItem { font-size: 15px; }
  /* 成员名片编辑 */
  .mc-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .mc-row input[type=color] { width: 30px; height: 30px; border: none; border-radius: 8px; background: none; padding: 0; flex-shrink: 0; }
  .mc-row input[type=text] { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(20,30,42,0.45); color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
  .mc-row .mc-save { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(20,30,42,0.45); color: var(--gold); font-size: 12px; flex-shrink: 0; }
  .mc-row .mc-save.done { color: var(--rose); border-color: var(--rose); }
  /* 搜索 */
  #searchInput {
    width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(20,30,42,0.55); color: var(--text); font-size: 15px; outline: none;
    font-family: inherit; margin-bottom: 10px;
  }
  .sr-item { padding: 10px 8px; border-radius: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .sr-item:active { background: rgba(255,255,255,0.06); }
  .sr-meta { font-size: 11px; color: var(--dim); margin-bottom: 3px; display: flex; gap: 8px; }
  .sr-text { font-size: 14px; line-height: 1.5; word-break: break-word; }
  .sr-text b { color: var(--gold-light); font-weight: 600; }
  .sr-empty { text-align: center; color: var(--dim); font-size: 13px; padding: 20px 0; }
  #backLatest {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 30;
    padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(212,168,87,0.4);
    background: rgba(18,23,33,0.85); color: var(--gold-light); font-size: 13px; display: none;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #backLatest.show { display: block; }
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="darkOverlayEl"></div>
<header>
  <div class="title">Le Salon</div>
  <div class="hright">
    <div class="roster" id="roster"></div>
    <button class="gear" onclick="openSearch()" style="font-size:16px">🔍</button>
    <button class="gear" onclick="openSheet('settingsPanel')">⚙</button>
  </div>
</header>
<div id="pinBar" onclick="jumpToPinned()">
  <span class="pin-ico">📌</span><span class="pin-txt" id="pinTxt"></span>
  <span class="pin-x" onclick="event.stopPropagation();unpin()">✕</span>
</div>
<div id="flow"></div>
<footer>
  <button class="fbtn" id="atBtn" onclick="openSheet('atPanel')">@</button>
  <button class="fbtn" id="noteBtn" title="只记录，不打扰">记</button>
  <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
  <button id="sendBtn">发送</button>
</footer>
<div id="mask" onclick="closeSheets()"></div>
<div class="sheet" id="atPanel"><h3>@ 谁？</h3><div id="atList"></div></div>
<button id="backLatest" onclick="backToLatest()">↓ 回到最新</button>
<div class="sheet" id="searchPanel">
  <h3>搜索群记录</h3>
  <input id="searchInput" placeholder="关键词…" autocomplete="off">
  <div id="searchResults"></div>
</div>
<div class="sheet" id="msgMenu"><h3>这条消息</h3><div id="msgMenuList"></div></div>
<div class="sheet" id="settingsPanel">
  <div class="sec">
    <div class="sec-label">背景</div>
    <label class="bg-option"><input type="radio" name="bgType" value="portal" checked onchange="setBgType('portal')">Portal 背景</label>
    <label class="bg-option"><input type="radio" name="bgType" value="custom" onchange="setBgType('custom')">自定义图片</label>
    <div id="uploadWrap" style="display:none">
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('bgFile').click()">点击上传背景图片</div>
      <input type="file" id="bgFile" accept="image/*" style="display:none" onchange="handleBgUpload(this)">
    </div>
  </div>
  <div class="sec">
    <div class="sec-label">外观</div>
    <div class="slider-row"><span class="sl">背景透明</span><input type="range" id="rgBg" min="0" max="100" value="100" oninput="setVar('bg',this.value)"><span class="sv" id="svBg">100%</span></div>
    <div class="slider-row"><span class="sl">玻璃模糊</span><input type="range" id="rgBlur" min="0" max="40" value="16" oninput="setVar('blur',this.value)"><span class="sv" id="svBlur">16</span></div>
    <div class="slider-row"><span class="sl">气泡通透</span><input type="range" id="rgBub" min="0" max="100" value="60" oninput="setVar('bub',this.value)"><span class="sv" id="svBub">60%</span></div>
    <div class="slider-row"><span class="sl">暗色蒙层</span><input type="range" id="rgOv" min="0" max="70" value="0" oninput="setVar('ov',this.value)"><span class="sv" id="svOv">0%</span></div>
    <div class="slider-row"><span class="sl">字体大小</span><input type="range" id="rgFont" min="85" max="130" value="100" oninput="setVar('font',this.value)"><span class="sv" id="svFont">100%</span></div>
    <button class="reset-btn" onclick="resetAppearance()">恢复默认</button>
  </div>
  <div class="sec">
    <div class="sec-label">群聊行为（全群生效）</div>
    <label class="bg-option"><input type="radio" name="replyMode" value="all" onchange="saveCfg({reply_mode:'all'})">我说话，全员都回</label>
    <label class="bg-option"><input type="radio" name="replyMode" value="pick" onchange="saveCfg({reply_mode:'pick'})">我说话，轮流挑一人回</label>
    <div class="slider-row"><span class="sl">熔断轮数</span><input type="range" id="rgChain" min="1" max="10" value="3" oninput="cfgSlide(this,'svChain',v=>v+'轮')" onchange="saveCfg({chain_limit:this.value})"><span class="sv" id="svChain">3轮</span></div>
    <div class="slider-row"><span class="sl">静默重置</span><input type="range" id="rgReset" min="5" max="60" step="5" value="20" oninput="cfgSlide(this,'svReset',v=>v+'分')" onchange="saveCfg({chain_reset_min:this.value})"><span class="sv" id="svReset">20分</span></div>
    <div class="slider-row"><span class="sl">续聊概率</span><input type="range" id="rgProb" min="0" max="100" value="60" oninput="cfgSlide(this,'svProb',v=>v+'%')" onchange="saveCfg({natural_prob:(this.value/100).toFixed(2)})"><span class="sv" id="svProb">60%</span></div>
    <label class="bg-option" style="margin-top:6px"><input type="checkbox" id="ckCheckin" onchange="saveCfg({checkin_enabled:this.checked?'1':'0'})">check-in（他们定时自己醒来看群）</label>
    <div class="slider-row"><span class="sl">最短间隔</span><input type="range" id="rgCMin" min="10" max="180" step="5" value="30" oninput="cfgSlide(this,'svCMin',v=>v+'分')" onchange="saveCheckinRange()"><span class="sv" id="svCMin">30分</span></div>
    <div class="slider-row"><span class="sl">最长间隔</span><input type="range" id="rgCMax" min="10" max="240" step="5" value="90" oninput="cfgSlide(this,'svCMax',v=>v+'分')" onchange="saveCheckinRange()"><span class="sv" id="svCMax">90分</span></div>
    <div class="slider-row"><span class="sl">静默开始</span><input type="range" id="rgQs" min="0" max="23" value="3" oninput="cfgSlide(this,'svQs',v=>v+'点')" onchange="saveQuiet()"><span class="sv" id="svQs">3点</span></div>
    <div class="slider-row"><span class="sl">静默结束</span><input type="range" id="rgQe" min="0" max="23" value="8" oninput="cfgSlide(this,'svQe',v=>v+'点')" onchange="saveQuiet()"><span class="sv" id="svQe">8点</span></div>
  </div>
  <div class="sec">
    <div class="sec-label">发布群公告（进群 + 置顶 + 推送给所有人）</div>
    <textarea id="announceInput" rows="2" placeholder="写一条群公告…" style="width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(20,30,42,.45);color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;"></textarea>
    <button class="reset-btn" style="color:var(--gold);border-color:rgba(212,168,87,.4);margin-top:8px" onclick="publishAnnounce()">📢 发布公告</button>
  </div>
  <div class="sec">
    <div class="sec-label">成员名片（改名字 / 颜色，全群生效）</div>
    <div id="memberCards"></div>
  </div>
</div>
<script>
const API = '/salon';
const ME = 'owner';
let lastId = 0, members = {}, mentions = [], noteMode = false, pinnedId = null, menuTargetId = null;
const flow = document.getElementById('flow');
const input = document.getElementById('input');

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mdInline(s) {
  return s
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');
}
function fmtTime(t) { const d = new Date(t.replace(' ', 'T')); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }

// ===== 外观设置（localStorage 设备级）=====
const VARMAP = {
  bg:   { css: '--bg-opacity',    fmt: v => v/100, sv: 'svBg',   disp: v => v+'%' },
  blur: { css: '--glass-blur',    fmt: v => v+'px', sv: 'svBlur', disp: v => v },
  bub:  { css: '--bubble-opacity',fmt: v => v/100, sv: 'svBub',  disp: v => v+'%' },
  ov:   { css: '--overlay',       fmt: v => v/100, sv: 'svOv',   disp: v => v+'%' },
  font: { css: '--font-scale',    fmt: v => v/100, sv: 'svFont', disp: v => v+'%' }
};
function setVar(key, val, skipSave) {
  const m = VARMAP[key];
  document.documentElement.style.setProperty(m.css, m.fmt(val));
  document.getElementById(m.sv).textContent = m.disp(val);
  const el = document.getElementById('rg' + key[0].toUpperCase() + key.slice(1));
  if (el) el.value = val;
  if (!skipSave) { const s = loadPrefs(); s[key] = val; localStorage.setItem('salon_prefs', JSON.stringify(s)); }
}
function loadPrefs() { try { return JSON.parse(localStorage.getItem('salon_prefs') || '{}'); } catch (e) { return {}; } }
function applyPrefs() {
  const s = loadPrefs();
  const def = { bg: 100, blur: 16, bub: 60, ov: 0, font: 100 };
  for (const k in def) setVar(k, s[k] !== undefined ? s[k] : def[k], true);
  if (s.bgType === 'custom' && localStorage.getItem('salon_bg')) {
    document.querySelector('input[name=bgType][value=custom]').checked = true;
    setBgType('custom', true);
  }
}
function resetAppearance() { localStorage.removeItem('salon_prefs'); localStorage.removeItem('salon_bg'); document.getElementById('wallpaper').style.backgroundImage = ''; document.querySelector('input[name=bgType][value=portal]').checked = true; applyPrefs(); }
function setBgType(type, skipSave) {
  const wrap = document.getElementById('uploadWrap');
  if (type === 'custom') {
    wrap.style.display = 'block';
    const img = localStorage.getItem('salon_bg');
    if (img) { document.getElementById('wallpaper').style.backgroundImage = `url(${img})`; document.getElementById('uploadArea').textContent = '✓ 已设置（点击更换）'; }
  } else {
    wrap.style.display = 'none';
    document.getElementById('wallpaper').style.backgroundImage = '';
  }
  if (!skipSave) { const s = loadPrefs(); s.bgType = type; localStorage.setItem('salon_prefs', JSON.stringify(s)); }
}
function handleBgUpload(inp) {
  const f = inp.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    const scale = Math.min(1, 1600 / img.width);
    cv.width = img.width * scale; cv.height = img.height * scale;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const data = cv.toDataURL('image/jpeg', 0.82);
    try { localStorage.setItem('salon_bg', data); } catch (e) { alert('图片太大存不下，换小一点的'); return; }
    document.getElementById('wallpaper').style.backgroundImage = `url(${data})`;
    document.getElementById('uploadArea').textContent = '✓ 已设置（点击更换）';
  };
  img.src = URL.createObjectURL(f);
}

// ===== 弹层 =====
function openSheet(id) { closeSheets(); document.getElementById(id).classList.add('open'); document.getElementById('mask').classList.add('show'); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); document.getElementById('mask').classList.remove('show'); }

// ===== 消息渲染 =====
function render(m) {
  if (m.id <= lastId) return;
  lastId = m.id;
  const el = document.createElement('div');
  el.className = 'msg' + (m.author_id === ME ? ' me' : '') + (m.kind === 'note' ? ' note' : '') + (m.kind === 'announce' ? ' announce' : '');
  el.dataset.mid = m.id;
  const who = members[m.author_id] || { name: m.author_id, color: '#888' };
  const annName = m.kind === 'announce' ? '📢 群公告' : esc(who.name);
  const annColor = m.kind === 'announce' ? 'var(--gold)' : who.color;
  let html = mdInline(esc(m.content)).replace(/@([一-龥\w]+)/g, '<span class="mention">@$1</span>');
  const thinkHtml = m.thinking ? `<div class="think" onclick="this.classList.toggle('open')"><span class="think-label">思考链</span><div class="think-body">${mdInline(esc(m.thinking))}</div></div>` : '';
  el.innerHTML = `<div class="meta"><span class="name" style="color:${annColor}">${annName}</span><span>${fmtTime(m.created_at)}</span></div>${thinkHtml}<div class="bubble">${html}</div>`;
  flow.appendChild(el);
}
function scrollBottom(force) {
  const nearBottom = flow.scrollHeight - flow.scrollTop - flow.clientHeight < 120;
  if (force || nearBottom) flow.scrollTop = flow.scrollHeight;
}
// （长按置顶已移除，群公告取代）
async function unpin() { closeSheets(); await fetch(`${API}/pin`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message_id: null }) }); }
function showPinned(msg) {
  const bar = document.getElementById('pinBar');
  if (!msg) { pinnedId = null; bar.classList.remove('show'); return; }
  pinnedId = msg.id;
  const who = members[msg.author_id] || { name: msg.author_id };
  document.getElementById('pinTxt').textContent = `${who.name}：${msg.content}`;
  bar.classList.add('show');
}
function jumpToPinned() {
  if (!pinnedId) return;
  const el = flow.querySelector(`[data-mid="${pinnedId}"]`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('pinned-flash'); setTimeout(() => el.classList.remove('pinned-flash'), 1600); }
}

// ===== 数据加载 =====
async function loadHistory() {
  const r = await fetch(`${API}/messages?limit=80`).then(r => r.json());
  r.messages.forEach(render); scrollBottom(true);
}
async function loadRoster() {
  const r = await fetch(`${API}/roster`).then(r => r.json());
  const rosterEl = document.getElementById('roster');
  rosterEl.innerHTML = '';
  const atList = document.getElementById('atList'); atList.innerHTML = '';
  r.members.forEach(m => {
    members[m.id] = m;
    const d = document.createElement('div');
    d.className = 'dot' + (m.online ? ' on' : '');
    d.style.background = m.color; d.textContent = m.name[0];
    d.title = m.name; rosterEl.appendChild(d);
    if (m.id !== ME) {
      const item = document.createElement('div');
      item.className = 'atItem';
      item.innerHTML = `<div class="d" style="background:${m.color}"></div>${esc(m.name)}${m.online ? '' : '<span class="off">离线</span>'}`;
      item.onclick = () => { addMention(m); closeSheets(); };
      atList.appendChild(item);
    }
  });
  renderMemberCards();
}
async function loadPinned() {
  const r = await fetch(`${API}/pinned`).then(r => r.json());
  showPinned(r.pinned);
}
function addMention(m) {
  if (!mentions.includes(m.id)) mentions.push(m.id);
  input.value += `@${m.name} `; input.focus(); autosize();
}
async function send() {
  const content = input.value.trim();
  if (!content) return;
  input.value = ''; autosize();
  const body = { author: ME, content, mentions, kind: noteMode ? 'note' : 'chat' };
  mentions = [];
  try {
    const r = await fetch(`${API}/send`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.sent) { render(j.sent); scrollBottom(true); }
  } catch (e) { alert('发送失败，网络？'); input.value = content; }
}
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; }

// ===== SSE + 轮询兜底 =====
function connectSSE() {
  const es = new EventSource(`${API}/stream`);
  es.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.type === 'new_message') { if (historyMode) return; render(ev.message); scrollBottom(); }
      if (ev.type === 'pin_changed') showPinned(ev.pinned);
      if (ev.type === 'roster_changed') loadRoster();
    } catch (_) {}
  };
  es.onerror = () => { es.close(); setTimeout(connectSSE, 4000); };
}
setInterval(async () => {
  try { if (historyMode) return; const r = await fetch(`${API}/messages?after=${lastId}`).then(r => r.json()); r.messages.forEach(render); scrollBottom(); } catch (_) {}
}, 12000);
setInterval(loadRoster, 30000);

// ===== 群公告 =====
async function publishAnnounce() {
  const t = document.getElementById('announceInput').value.trim();
  if (!t) return;
  await fetch(`${API}/announce`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ content: t }) });
  document.getElementById('announceInput').value = '';
  closeSheets();
}

// ===== 成员名片编辑 =====
function renderMemberCards() {
  const box = document.getElementById('memberCards'); if (!box) return;
  box.innerHTML = '';
  Object.values(members).forEach(m => {
    const row = document.createElement('div'); row.className = 'mc-row';
    row.innerHTML = `<input type="color" value="${m.color || '#888888'}"><input type="text" value="${esc(m.name)}" maxlength="12"><button class="mc-save">存</button>`;
    const [cIn, nIn, btn] = row.children;
    btn.onclick = async () => {
      await fetch(`${API}/member/update`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: m.id, name: nIn.value, color: cIn.value }) });
      btn.textContent = '✓'; btn.classList.add('done');
      setTimeout(() => { btn.textContent = '存'; btn.classList.remove('done'); }, 1500);
      loadRoster();
    };
    box.appendChild(row);
  });
}

// ===== 群聊行为配置 =====
function cfgSlide(el, svId, fmt) { document.getElementById(svId).textContent = fmt(el.value); }
async function saveCfg(obj) { await fetch(`${API}/config`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(obj) }); }
function saveCheckinRange() {
  const mn = +document.getElementById('rgCMin').value, mx = Math.max(mn, +document.getElementById('rgCMax').value);
  saveCfg({ checkin_min: mn, checkin_max: mx });
}
function saveQuiet() {
  saveCfg({ quiet_hours: document.getElementById('rgQs').value + '-' + document.getElementById('rgQe').value });
}
async function loadCfg() {
  try {
    const c = await fetch(`${API}/config`).then(r => r.json());
    const rm = document.querySelector(`input[name=replyMode][value="${c.reply_mode}"]`); if (rm) rm.checked = true;
    const setS = (id, sv, val, fmt) => { const el = document.getElementById(id); el.value = val; document.getElementById(sv).textContent = fmt(val); };
    setS('rgChain', 'svChain', parseInt(c.chain_limit), v => v + '轮');
    setS('rgReset', 'svReset', parseInt(c.chain_reset_min), v => v + '分');
    setS('rgProb', 'svProb', Math.round(parseFloat(c.natural_prob) * 100), v => v + '%');
    document.getElementById('ckCheckin').checked = c.checkin_enabled === '1';
    setS('rgCMin', 'svCMin', c.checkin_min, v => v + '分');
    setS('rgCMax', 'svCMax', c.checkin_max, v => v + '分');
    const [qs, qe] = c.quiet_hours.split('-');
    setS('rgQs', 'svQs', qs, v => v + '点');
    setS('rgQe', 'svQe', qe, v => v + '点');
  } catch (e) {}
}

// ===== 搜索 =====
let searchTimer = null, historyMode = false;
function openSearch() { openSheet('searchPanel'); setTimeout(() => document.getElementById('searchInput').focus(), 250); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    const q = this.value.trim();
    if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
    searchTimer = setTimeout(() => doSearch(q), 300);
  });
});
async function doSearch(q) {
  const r = await fetch(`${API}/search?q=${encodeURIComponent(q)}`).then(r => r.json());
  const box = document.getElementById('searchResults');
  if (!r.results.length) { box.innerHTML = '<div class="sr-empty">没有找到</div>'; return; }
  box.innerHTML = '';
  r.results.forEach(m => {
    const who = members[m.author_id] || { name: m.author_id, color: '#888' };
  const annName = m.kind === 'announce' ? '📢 群公告' : esc(who.name);
  const annColor = m.kind === 'announce' ? 'var(--gold)' : who.color;
    const el = document.createElement('div');
    el.className = 'sr-item';
    const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const hl = esc(m.content).replace(new RegExp(safeQ.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])), 'gi'), s => `<b>${s}</b>`);
    el.innerHTML = `<div class="sr-meta"><span style="color:${who.color}">${esc(who.name)}</span><span>${m.created_at}</span></div><div class="sr-text">${hl}</div>`;
    el.onclick = () => { closeSheets(); jumpToMsg(m.id); };
    box.appendChild(el);
  });
}
async function jumpToMsg(mid) {
  const r = await fetch(`${API}/messages?around=${mid}`).then(r => r.json());
  flow.innerHTML = ''; lastId = 0;
  r.messages.forEach(render);
  lastId = Math.max(lastId, ...r.messages.map(m => m.id));
  historyMode = true;
  document.getElementById('backLatest').classList.add('show');
  const el = flow.querySelector(`[data-mid="${mid}"]`);
  if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('pinned-flash'); setTimeout(() => el.classList.remove('pinned-flash'), 1800); }
}
async function backToLatest() {
  historyMode = false;
  document.getElementById('backLatest').classList.remove('show');
  flow.innerHTML = ''; lastId = 0;
  await loadHistory();
}

// ===== 事件绑定 =====
document.getElementById('sendBtn').onclick = send;
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); } });
document.getElementById('noteBtn').onclick = function() { noteMode = !noteMode; this.classList.toggle('on', noteMode); };

// ===== 启动 =====
applyPrefs();
loadCfg();
loadRoster().then(loadHistory).then(loadPinned).then(connectSSE);
</script>
